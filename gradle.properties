org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# The whole app hinges on targeting an SDK below 29 (see README). AGP warns that
# compileSdk > targetSdk; that is deliberate, so silence the warning rather than
# have someone "helpfully" bump targetSdk and break the Wi-Fi toggle.
android.suppressUnsupportedCompileSdk=34
