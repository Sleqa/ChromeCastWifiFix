name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # The decision-making core has no Android dependencies, so this runs as a
      # plain JVM test suite on every push.
      - name: Unit tests
        run: ./gradlew test --stacktrace

      # A green `test` task is not proof anything ran -- Gradle reports success
      # for an empty suite too. Count the executed tests and fail if it is zero.
      - name: Verify tests actually ran
        run: |
          total=$(find app/build/test-results -name '*.xml' -print0 2>/dev/null \
            | xargs -0 --no-run-if-empty grep -ho 'tests="[0-9]*"' \
            | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')
          echo "Tests executed: $total"
          if [ "$total" -eq 0 ]; then
            echo "::error::No tests were executed"
            exit 1
          fi

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "No KEYSTORE_BASE64 secret set; falling back to debug signing." >&2
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      # With no keystore configured the release build falls back to the debug
      # signing key, so this workflow always produces an installable APK.
      - name: Assemble release APK
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: chromecastwififix-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: app/build/outputs/apk/release/*.apk
